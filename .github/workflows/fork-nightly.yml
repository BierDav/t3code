name: Fork nightly

# Builds placement-profiles as it is and publishes the Linux x64 CLI, the macOS
# arm64 CLI and the macOS arm64 desktop app as the prerelease fork-v<version>,
# where <version> is the newest upstream nightly merged into it. fork-kit
# (fork-kit.yml) merges each upstream nightly into placement-profiles through a
# checked pull request, so nothing is merged here. A failed check or build
# publishes nothing, so the previous release stays.
#
# A push to the feature branch cannot start this workflow by itself: push runs
# use the workflow files of the pushed branch. The schedule picks the branch up
# within 30 minutes, or a dispatch starts it at once.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      feature_ref:
        description: Branch or commit to build. Anything but placement-profiles publishes fork-test-v<version> instead.
        required: false
        default: placement-profiles
        type: string
      force:
        description: Build even when a release already holds this upstream tag and feature commit.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-nightly
  cancel-in-progress: false

env:
  FEATURE_REF: ${{ inputs.feature_ref || 'placement-profiles' }}

jobs:
  prepare:
    name: Find the feature commit and its upstream nightly
    if: github.repository == 'BierDav/t3code' && github.ref_name == 'prism-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.source.outputs.build }}
      upstream_tag: ${{ steps.source.outputs.upstream_tag }}
      upstream_sha: ${{ steps.source.outputs.upstream_sha }}
      version: ${{ steps.source.outputs.version }}
      feature_sha: ${{ steps.source.outputs.feature_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      merge_sha: ${{ steps.merged.outputs.merge_sha }}
    steps:
      - name: Find the upstream nightly and the feature commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          [[ "$FEATURE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid feature_ref: $FEATURE_REF"; exit 1; }

          if ! feature_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$FEATURE_REF" --jq .sha 2>/dev/null); then
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "::notice::$FEATURE_REF does not exist on $GITHUB_REPOSITORY yet; nothing to build."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$FEATURE_REF does not exist on $GITHUB_REPOSITORY."
            exit 1
          fi

          # The newest upstream nightly tag the feature commit has merged.
          # Commits only (tree:0); upstream's tags are not in this repository.
          git init -q "$RUNNER_TEMP/history"
          git -C "$RUNNER_TEMP/history" fetch -q --no-tags --filter=tree:0 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$feature_sha"
          git -C "$RUNNER_TEMP/history" fetch -q --no-tags --filter=tree:0 https://github.com/pingdotgg/t3code.git '+refs/tags/*:refs/tags/*'
          tag=$(git -C "$RUNNER_TEMP/history" tag --merged "$feature_sha" --sort=-v:refname 'v*-nightly.*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$' | head -n 1 || true)
          [[ -n "$tag" ]] || { echo "::error::$FEATURE_REF ($feature_sha) has no upstream nightly merged."; exit 1; }
          version="${tag#v}"
          upstream_sha=$(git -C "$RUNNER_TEMP/history" rev-parse "refs/tags/$tag^{commit}")

          if [[ "$FEATURE_REF" == placement-profiles ]]; then
            release_tag="fork-v$version"
          else
            release_tag="fork-test-v$version"
          fi

          build=true
          if [[ "$FORCE" != true ]] && release=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json body,assets 2>/dev/null); then
            body=$(jq -r .body <<<"$release")
            assets=$(jq -c '[.assets[].name]' <<<"$release")
            want=$(jq -nc --arg v "$version" '["t3-\($v)-linux-x64.tar.gz", "t3-\($v)-darwin-arm64.tar.gz", "T3-Code-\($v)-arm64.zip"]')
            if grep -Fxq "Upstream: $tag ($upstream_sha)" <<<"$body" \
              && grep -Fxq "$FEATURE_REF: $feature_sha" <<<"$body" \
              && [[ $(jq -n --argjson a "$assets" --argjson w "$want" '($w - $a) == []') == true ]]; then
              echo "::notice::$release_tag already holds $tag with $FEATURE_REF at $feature_sha."
              build=false
            fi
          fi

          {
            echo "build=$build"
            echo "upstream_tag=$tag"
            echo "upstream_sha=$upstream_sha"
            echo "version=$version"
            echo "feature_sha=$feature_sha"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          if [[ "$build" == true ]]; then
            {
              echo "UPSTREAM_TAG=$tag"
              echo "UPSTREAM_SHA=$upstream_sha"
              echo "FEATURE_SHA=$feature_sha"
            } >> "$GITHUB_ENV"
          fi
          echo "Upstream $tag ($upstream_sha), $FEATURE_REF $feature_sha, release $release_tag, build=$build"

      # Every later job repeats this step on its own runner.
      - &merge
        name: Check out the feature commit
        if: env.UPSTREAM_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --no-tags --filter=blob:none https://github.com/pingdotgg/t3code.git "+refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git fetch -q --no-tags --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$FEATURE_SHA"
          [[ "$(git rev-parse "refs/tags/$UPSTREAM_TAG^{commit}")" == "$UPSTREAM_SHA" ]]
          git merge-base --is-ancestor "$UPSTREAM_SHA" "$FEATURE_SHA"
          # Upstream's vendored .repos tree holds orphaned gitlinks.
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach "$FEATURE_SHA"
          git log -1 --format='Building %H'

      - name: Record the built commit
        id: merged
        if: env.UPSTREAM_TAG != ''
        run: echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: Typecheck and test
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: &merge_env
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      FEATURE_SHA: ${{ needs.prepare.outputs.feature_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - *merge
      # A full install: the server typecheck also covers the root scripts package.
      - uses: ./.github/actions/setup-ci-deps
      - name: Typecheck
        run: |
          set -euo pipefail
          for dir in packages/contracts packages/shared apps/server; do
            echo "::group::typecheck $dir"
            (cd "$dir" && vp run typecheck)
            echo "::endgroup::"
          done
      - name: Test the files the feature branch touches
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$UPSTREAM_SHA...$FEATURE_SHA" -- 'apps/server/**/*.test.ts' 'packages/shared/**/*.test.ts')
          server=() shared=()
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              apps/server/*) server+=("${file#apps/server/}") ;;
              packages/shared/*) shared+=("${file#packages/shared/}") ;;
            esac
          done
          if (( ${#shared[@]} )); then
            (cd packages/shared && vp test run --config ../../vite.config.ts "${shared[@]}")
          fi
          if (( ${#server[@]} )); then
            (cd apps/server && vp test run "${server[@]}")
          fi
          if (( ${#shared[@]} + ${#server[@]} == 0 )); then
            echo "The feature branch touches no server or shared tests."
          fi

  bundle:
    name: Build the JS bundle
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: *merge_env
    steps:
      - *merge
      - &public_config
        name: Use the public T3 Connect config
        shell: bash
        run: |
          set -euo pipefail
          # The same public identifiers upstream bakes into its builds (see .env.example).
          for name in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value=$(sed -n "s|^T3CODE_$name=||p" .env.example)
            [[ -n "$value" ]] || { echo "::error::.env.example lacks T3CODE_$name"; exit 1; }
            echo "T3CODE_$name=$value" >> "$GITHUB_ENV"
          done
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - &align_versions
        name: Align package versions to the upstream version
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Build the JS bundle
        run: vp run build:desktop:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build the Linux x64 CLI
    needs: [prepare, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: *merge_env
    steps:
      - *merge
      - *public_config
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - *align_versions
      - &download_bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps
      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }
      - &build_cli
        name: Build and smoke-test the CLI archive
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux arch=x64 rust_target=x86_64-unknown-linux-gnu key=linux-x64 ;;
            macOS-ARM64) platform=mac arch=arm64 rust_target=aarch64-apple-darwin key=darwin-arm64 ;;
            *) echo "::error::Unexpected runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$rust_target"
          node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
          node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/$key"
          cp "native/resource-monitor/target/$rust_target/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/$key/"
          # No signing identity or Apple key here, so macOS signs the CLI ad hoc.
          node scripts/build-cli-archive.ts \
            --platform "$platform" --arch "$arch" --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          archive="release-cli/t3-$VERSION-$key.tar.gz"
          ls -l release-cli
          [[ -f "$archive" ]]
          node scripts/smoke-cli-archive.ts --archive "$archive" --expect-version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/t3-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  mac:
    name: Build the macOS arm64 CLI and app
    needs: [prepare, bundle]
    runs-on: macos-26
    timeout-minutes: 60
    env: *merge_env
    steps:
      - *merge
      - *public_config
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - *align_versions
      - *download_bundle
      - *build_cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-mac-arm64
          path: release-cli/t3-${{ env.VERSION }}-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # The build takes its update feed from T3CODE_DESKTOP_UPDATE_REPOSITORY or
      # GITHUB_REPOSITORY. With neither set it writes no app-update.yml, and the
      # app turns automatic updates off ("no update feed is configured").
      - name: Build the desktop app without an update feed
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY \
            vp run dist:desktop:artifact --platform mac --target zip --arch arm64 \
              --build-version "$VERSION" --skip-build --verbose
      - name: Sign the app ad hoc and check it opens
        run: |
          set -euo pipefail
          zip="release/T3-Code-$VERSION-arm64.zip"
          ls -l release
          work="$RUNNER_TEMP/mac-app"
          rm -rf "$work" && mkdir -p "$work" release-app
          ditto -x -k "$zip" "$work"
          app=$(find "$work" -maxdepth 1 -name '*.app' -print -quit)
          [[ -d "$app" ]]
          if [[ -e "$app/Contents/Resources/app-update.yml" ]]; then
            echo "::error::The app carries an update feed:"
            cat "$app/Contents/Resources/app-update.yml"
            exit 1
          fi
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-app/T3-Code-$VERSION-arm64.zip"
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$app/Contents/MacOS/$executable"
      - name: Upload launch check output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-arm64
          path: release-app/T3-Code-${{ env.VERSION }}-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish the fork prerelease
    needs: [prepare, check, linux, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*64"
          merge-multiple: true
          path: assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          FEATURE_SHA: ${{ needs.prepare.outputs.feature_sha }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
        run: |
          set -euo pipefail
          cd assets
          files=("t3-$VERSION-linux-x64.tar.gz" "t3-$VERSION-darwin-arm64.tar.gz" "T3-Code-$VERSION-arm64.zip")
          ls -l
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Upstream: %s (%s)\n%s: %s\nMerge: %s\n\nBuilt by %s.\n' \
            "$UPSTREAM_TAG" "$UPSTREAM_SHA" "$FEATURE_REF" "$FEATURE_SHA" "$MERGE_SHA" "$run_url" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Notes go last: until they name the new commits, the next run rebuilds.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}" SHA256SUMS
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "T3 Code fork $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}" SHA256SUMS
          fi
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
